<script>(function(){const t=localStorage.getItem('pm-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
.ptabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-bottom:3rem}
.ptab{text-align:left;padding:1.1rem 1.3rem;border:1px solid var(--border2);border-radius:var(--radius-lg);background:transparent;color:var(--text);font:inherit;transition:.25s}
.ptab:hover{border-color:var(--amber)}
.ptab[aria-selected="true"]{background:var(--card);border-color:var(--amber);box-shadow:0 0 0 3px rgba(var(--amber-rgb),.15)}
.ptab strong{display:block;font-family:'Instrument Serif',serif;font-weight:400;font-size:1.8rem;line-height:1.1}
.ptab span{font-size:.85rem;color:var(--text2)}
.stage{animation:fadeUp .45s both}
.stage h2{font-size:clamp(2.8rem,6vw,4.8rem);line-height:1;margin:.3rem 0 .8rem}
.stage .sub{font-size:1.15rem;color:var(--text2);max-width:640px;margin-bottom:1.2rem}
.lane-t{font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2rem 0 .6rem}
.flow{display:flex;gap:1.7rem;overflow-x:auto;padding:.3rem .2rem 1rem}
.step{position:relative;flex:1 0 150px;padding:.9rem 1rem;border:1px solid var(--border2);border-radius:var(--radius);background:var(--card);font-size:.86rem;line-height:1.45;color:var(--text2)}
.step b{display:block;font:500 .7rem 'JetBrains Mono',monospace;color:var(--amber);margin-bottom:.35rem}
.step:not(:last-child)::after{content:'→';position:absolute;right:-1.35rem;top:50%;transform:translateY(-50%);color:var(--amber)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border)}
.two h4{font:500 .75rem 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:0 0 .8rem}
.two ul{padding-left:1.1rem;margin:0;color:var(--text2)}.two li{margin:.6rem 0}
.big{margin-bottom:1.3rem}.big b{display:block;font-family:'Instrument Serif',serif;font-weight:400;font-size:3rem;line-height:1}.big span{font-size:.85rem;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin-top:1.5rem}
@media(max-width:800px){.flow{flex-direction:column;overflow:visible}.step:not(:last-child)::after{content:'↓';right:auto;left:1rem;top:auto;bottom:-1.45rem;transform:none}.two{grid-template-columns:1fr;gap:2rem}}
</style>
</head>
<body>

<script src="js/main.js"></script>
<script>
const P = {
  'merrys-way': {
    name: "Merry's Way", tab: 'AI assistant and data analyst for coffee shops', date: 'Jun 2025 – Present',
    sub: 'A two-sided AI platform: an ordering assistant for customers and a business analyst for shop owners, running as two independent pipelines on one backend.',
    repo: 'https://github.com/Pandharimaske/Multi-Agent-Commerce-Platform-for-Coffee-Shop',
    lanes: [
      { t: 'Customer assistant', s: ['Customer message', 'Memory of preferences and allergies', 'Menu search and recommendations', 'Prices and allergen filter, in code', 'Customer approves', 'Order and payment'] },
      { t: 'Owner analyst', s: ['Question in plain English', 'Asks to clarify if ambiguous', 'Writes SQL', 'Runs read-only on anonymised views', 'Retries itself on errors', 'Answer, with chart or table'] }
    ],
    dec: ['Prices and allergen filtering are done in code, not by the LLM.', 'Saving memory and taking payment both wait for the customer\'s approval.', 'The analyst can only read, and only from anonymised views, so customers\' personal data never reaches the model.', 'It declines off-topic requests and any request to change data.'],
    res: [['92.8%', 'of owner questions answered correctly in 153 test runs, up from 86.9%'], ['0/54', 'attack prompts got through']],
    note: 'LangGraph · FastAPI · Supabase pgvector · React · Docker · Render · Vercel'
  },
  'rubrictrace': {
    name: 'RubricTrace', tab: 'Handwritten exam grader', date: 'Sept 2026 – Present',
    sub: 'A self-hosted grader for scanned handwritten exams. The AI does the first pass; the teacher stays in control.',
    repo: 'https://github.com/Pandharimaske/RubricTrace',
    lanes: [
      { t: 'Grading pipeline', s: ['Teacher defines the exam once', 'Bulk upload of scanned papers', 'Vision model reads each page', 'Objective answers: fixed rules. The rest: LLM vs rubric', 'Unsure answers go to the teacher', 'Mark and reasoning for every answer'] }
    ],
    dec: ['Blank pages are skipped, answers spanning pages are merged, and illegible ones are flagged.', 'Changing how strict the review threshold is re-sorts existing grades without re-grading.', 'Teacher decisions are never overwritten by a re-grade.'],
    res: [['0.94', 'agreement with teacher marks (QWK, 1.0 = perfect) on multiple-choice questions'], ['96.9%', 'of multiple-choice marks identical to the teacher\'s']],
    note: 'Tested on a public dataset of 50 students with teacher marks (1,000 multiple-choice records). FastAPI · React · Pydantic · PostgreSQL'
  },
  'risklens': {
    name: 'RiskLens', tab: 'Insurance claim MLOps pipeline', date: 'March 2025',
    sub: 'An end-to-end pipeline that predicts vehicle insurance claim likelihood, from raw data to a deployed API.',
    repo: 'https://github.com/Pandharimaske/CreditRisk-MLSystem',
    lanes: [
      { t: 'Pipeline', s: ['Data from AWS S3', 'Schema validation', 'XGBoost and LightGBM, tuned with Optuna', 'New model must beat the current one', 'Promoted in MLflow registry', 'Docker image to ECR, run on EC2', 'FastAPI prediction endpoint'] }
    ],
    dec: ['A new model replaces the current one only if it beats it on AUC by more than 0.005.', 'Data and parameters are versioned with DVC, and runs are tracked on DagsHub with SHAP charts.', 'Every push to main builds the image, pushes it to AWS ECR and redeploys on EC2.', 'Claims are rare, so training data is rebalanced with SMOTEENN.'],
    res: [['0.91', 'AUC-ROC (1.0 = perfect separation of claims from non-claims)'], ['0.79 → 0.86', 'F1 score before and after tuning and resampling']],
    note: 'XGBoost · LightGBM · Optuna · MLflow · DVC · SHAP · FastAPI · Docker · GitHub Actions · AWS (S3, ECR, EC2)'
  }
};
const tabs = document.getElementById('ptabs'), stage = document.getElementById('stage');
function show(id) {
  const p = P[id]; if (!p) return;
  tabs.querySelectorAll('.ptab').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id));
  history.replaceState(null, '', '#' + id);
  stage.innerHTML = `<div class="stage">
    <span class="eyebrow">${p.date}</span><h2>${p.name}</h2><p class="sub">${p.sub}</p>
    <a class="btn btn-primary" href="${p.repo}" target="_blank" rel="noopener"><i class="fab fa-github"></i> View code</a>
    ${p.lanes.map(l => `<div class="lane-t">${p.lanes.length > 1 ? l.t : 'How it works'}</div><div class="flow">${l.s.map((s, i) => `<div class="step"><b>${String(i + 1).padStart(2, '0')}</b>${s}</div>`).join('')}</div>`).join('')}
    <div class="two"><div><h4>Key decisions</h4><ul>${p.dec.map(d => `<li>${d}</li>`).join('')}</ul></div>
    <div><h4>Results</h4>${p.res.map(r => `<div class="big"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div></div>
    <p class="note">${p.note}</p></div>`;
}
Object.entries(P).forEach(([id, p]) => {
  const b = document.createElement('button'); b.className = 'ptab'; b.dataset.id = id; b.setAttribute('role', 'tab');
  b.innerHTML = `<strong>${p.name}</strong><span>${p.tab}</span>`;
  b.onclick = () => show(id); tabs.appendChild(b);
});
show(P[location.hash.slice(1)] ? location.hash.slice(1) : 'merrys-way');
</script>
